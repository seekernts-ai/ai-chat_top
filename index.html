<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Moa 💞</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {

  --app-height: 100dvh;

  --bg: #000000;
  --header: #09090b;
  --composer: #08080a;

  --border: #1c1c20;

  --bubble: #17171b;
  --bubble-border: #29292f;

  --text: #ffffff;
  --muted: #8c8c93;

  --snap-blue: #24a8ff;
  --snap-red: #ff2d55;

  --composer-height: 76px;

}

html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}


/* =========================
   APP
   ========================= */

.app {

  position: relative;

  width: 100%;
  height: var(--app-height);

  overflow: hidden;

  background: var(--bg);

}


@media (min-width: 700px) {

  body {

    display: flex;

    justify-content: center;

    background: #050505;

  }


  .app {

    max-width: 430px;

    border-left:
      1px solid #161616;

    border-right:
      1px solid #161616;

  }

}


/* =========================
   HEADER
   ========================= */

.header {

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height:
    calc(
      78px +
      env(safe-area-inset-top)
    );

  padding:
    calc(
      8px +
      env(safe-area-inset-top)
    )
    12px
    8px;

  z-index: 30;

  display: flex;

  align-items: center;

  gap: 8px;

  background: var(--header);

  border-bottom:
    1px solid var(--border);

}


.header-button {

  width: 40px;
  height: 40px;

  border: none;

  border-radius: 50%;

  background: transparent;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

}


.header-button svg {

  width: 25px;
  height: 25px;

}


.profile {

  flex: 1;

  min-width: 0;

  display: flex;

  align-items: center;

  gap: 10px;

}


.profile-avatar {

  width: 50px;
  height: 50px;

  border-radius: 50%;

  overflow: hidden;

  background: #eee;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

}


.profile-avatar img {

  width: 125%;
  height: 125%;

  object-fit: cover;

  object-position:
    center 24%;

}


.profile-info {

  min-width: 0;

}


.profile-name {

  font-size: 20px;

  font-weight: 750;

  line-height: 1.1;

}


.profile-status {

  margin-top: 3px;

  font-size: 14px;

  color: var(--muted);

}


.header-actions {

  display: flex;

  align-items: center;

}


/* =========================
   CHAT
   ========================= */

.chat {

  position: absolute;

  top:
    calc(
      78px +
      env(safe-area-inset-top)
    );

  left: 0;
  right: 0;

  bottom:
    calc(
      var(--composer-height) +
      env(safe-area-inset-bottom)
    );

  z-index: 1;

  overflow-y: auto;

  overscroll-behavior:
    contain;

  padding:
    18px
    12px
    155px;

  background: #000;

  scrollbar-width: none;

}


.chat::-webkit-scrollbar {
  display: none;
}


/* =========================
   DATE
   ========================= */

.date-divider {

  display: flex;

  align-items: center;

  gap: 12px;

  margin:
    4px
    0
    22px;

}


.date-divider-line {

  height: 1px;

  flex: 1;

  background: #1d1d20;

}


.date-divider-text {

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 1px;

  color: #77777e;

}


/* =========================
   MESSAGES
   ========================= */

.message-group {

  display: flex;

  flex-direction: column;

  gap: 5px;

  margin-bottom: 18px;

}


.message-group.ai {

  align-items:
    flex-start;

}


.message-group.user {

  align-items:
    flex-end;

}


.sender {

  padding:
    0 3px;

  font-size: 14px;

  font-weight: 750;

}


.message-group.ai
.sender {

  color: var(--snap-blue);

}


.message-group.user
.sender {

  color: var(--snap-red);

}


.message {

  max-width: 84%;

  padding:
    12px
    15px;

  border:
    1px solid
    var(--bubble-border);

  border-radius: 20px;

  background:
    var(--bubble);

  color: white;

  font-size: 16px;

  line-height: 1.4;

  white-space: pre-wrap;

  word-break: break-word;

}


.message-group.ai
.message {

  border-top-left-radius:
    8px;

}


.message-group.user
.message {

  max-width: 75%;

  border-top-right-radius:
    8px;

}


/* =========================
   BITMOJI
   ========================= */

.bitmoji-stage {

  position: absolute;

  left: 14px;

  bottom:
    calc(
      var(--composer-height) +
      env(safe-area-inset-bottom)
      - 19px
    );

  width: 180px;

  height: 180px;

  z-index: 15;

  pointer-events: none;

}


.bitmoji-character {

  position: absolute;

  transform-origin:
    bottom center;

  transition:
    opacity .18s ease,
    transform .22s ease,
    width .22s ease,
    left .22s ease,
    bottom .22s ease;

}


.bitmoji-character img {

  display: block;

  width: 100%;

  height: auto;

  user-select: none;

  -webkit-user-drag: none;

}


/* idle */

.bitmoji-character.peek {

  width: 158px;

  left: -4px;

  bottom: -21px;

  transform:
    translateY(0);

}


/* thinking */

.bitmoji-character.thinking {

  width: 111px;

  left: 2px;

  bottom: -47px;

  transform:
    translateY(-5px);

}


/* =========================
   TYPING BUBBLE
   ========================= */

.typing-wrapper {

  position: absolute;

  left: 87px;

  bottom: 105px;

  opacity: 0;

  transform:
    translateY(8px)
    scale(.94);

  transition:
    opacity .18s ease,
    transform .18s ease;

}


.typing-wrapper.visible {

  opacity: 1;

  transform:
    translateY(0)
    scale(1);

}


.typing-bubble {

  position: relative;

  min-width: 64px;

  height: 41px;

  padding:
    0 14px;

  border-radius: 23px;

  background: white;

  display: flex;

  align-items: center;

  justify-content: center;

  box-shadow:
    0 7px 18px
    rgba(
      0,
      0,
      0,
      .35
    );

}


.typing-bubble::after {

  content: "";

  position: absolute;

  left: -5px;

  bottom: 7px;

  width: 15px;

  height: 15px;

  background: white;

  transform:
    rotate(32deg);

  border-bottom-right-radius:
    12px;

}


.typing-dots {

  display: flex;

  align-items: center;

  gap: 5px;

}


.typing-dots span {

  width: 7px;

  height: 7px;

  border-radius: 50%;

  background: #252525;

  animation:
    typingDot
    1s
    infinite
    ease-in-out;

}


.typing-dots
span:nth-child(2) {

  animation-delay:
    .14s;

}


.typing-dots
span:nth-child(3) {

  animation-delay:
    .28s;

}


@keyframes typingDot {

  0%,
  75%,
  100% {

    opacity: .35;

    transform:
      translateY(0);

  }


  35% {

    opacity: 1;

    transform:
      translateY(-3px);

  }

}


/* =========================
   COMPOSER
   ========================= */

.composer-shell {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 20;

  min-height:
    calc(
      var(--composer-height) +
      env(safe-area-inset-bottom)
    );

  padding:
    9px
    10px
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  border-top:
    1px solid #1a1a1e;

  background:
    rgba(
      8,
      8,
      10,
      .985
    );

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

}


.composer {

  width: 100%;

  display: flex;

  align-items: center;

  gap: 7px;

}


/* camera */

.camera-button {

  width: 46px;

  height: 46px;

  flex-shrink: 0;

  border: none;

  border-radius: 50%;

  background: white;

  color: black;

  display: flex;

  align-items: center;

  justify-content: center;

}


.camera-button svg {

  width: 25px;

  height: 25px;

}


/* input */

.input-shell {

  flex: 1;

  min-width: 0;

  height: 46px;

  padding:
    0
    9px
    0
    11px;

  border:
    2px solid #38383e;

  border-radius:
    25px;

  background:
    #060607;

  display: flex;

  align-items: center;

  gap: 7px;

}


.input-red-line {

  width: 3px;

  height: 25px;

  border-radius:
    999px;

  background:
    var(--snap-red);

  flex-shrink: 0;

}


.chat-input {

  flex: 1;

  min-width: 0;

  height: 100%;

  border: none;

  outline: none;

  background:
    transparent;

  color: white;

  font-size: 16px;

}


.chat-input::placeholder {

  color: #7a7a82;

}


/* mic */

.input-action {

  width: 31px;

  height: 31px;

  border: none;

  background:
    transparent;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

}


.input-action svg {

  width: 22px;

  height: 22px;

  fill: none;

  stroke:
    currentColor;

  stroke-width: 2;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;

}


/* icons */

.composer-actions {

  display: flex;

  align-items: center;

  gap: 1px;

  flex-shrink: 0;

}


.composer-action {

  width: 33px;

  height: 40px;

  border: none;

  background:
    transparent;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

}


.composer-action svg {

  width: 24px;

  height: 24px;

  fill: none;

  stroke:
    currentColor;

  stroke-width: 2;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;

}


/* send */

.send-button {

  width: 40px;

  height: 40px;

  border: none;

  border-radius: 50%;

  background:
    #0a84ff;

  color: white;

  display: none;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

}


.send-button.visible {

  display: flex;

}


.send-button svg {

  width: 21px;

  height: 21px;

  fill: none;

  stroke:
    currentColor;

  stroke-width: 2.5;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;

}

</style>

</head>

<script>

/*
  =========================
  CONFIG
  =========================
*/

const WORKER_URL =
  "https://moa-ai-backend.seekernets.workers.dev";


const PEEK_BITMOJI =
  "bitmoji_peek.png";


const THINKING_BITMOJI =
  "bitmoji_thinking.png";


const STORAGE_KEY =
  "moa_chat_history_v1";


/*
  AI settings

  Sen kan vi koppla detta
  till din inställningsmeny.
*/

const aiSettings = {

  name:
    "Moa 💞",

  personality:
    "varm, avslappnad, rolig och naturlig",

  replyLength:
    "kort",

  emojiLevel:
    "medium",

  customInstructions:
    ""

};



/*
  =========================
  ELEMENTS
  =========================
*/

const chat =
  document.getElementById(
    "chat"
  );


const messageList =
  document.getElementById(
    "messageList"
  );


const input =
  document.getElementById(
    "messageInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const micButton =
  document.getElementById(
    "micButton"
  );


const composerActions =
  document.getElementById(
    "composerActions"
  );


const bitmojiImage =
  document.getElementById(
    "bitmojiImage"
  );


const bitmojiCharacter =
  document.getElementById(
    "bitmojiCharacter"
  );


const typingWrapper =
  document.getElementById(
    "typingWrapper"
  );


const profileStatus =
  document.getElementById(
    "profileStatus"
  );



/*
  =========================
  HISTORY
  =========================
*/

let conversationHistory = [];


try {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (saved) {

    const parsed =
      JSON.parse(saved);


    if (
      Array.isArray(parsed)
    ) {

      conversationHistory =
        parsed;

    }

  }

}

catch {

  conversationHistory = [];

}



/*
  =========================
  SAVE HISTORY
  =========================
*/

function saveHistory() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        conversationHistory
      )
    );

  }

  catch {

    // ignore storage error

  }

}



/*
  =========================
  VIEWPORT
  =========================
*/

function updateViewportHeight() {

  const height =
    window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;


  document
    .documentElement
    .style
    .setProperty(
      "--app-height",
      height + "px"
    );

}


updateViewportHeight();


window.addEventListener(
  "resize",
  updateViewportHeight
);


if (
  window.visualViewport
) {

  window.visualViewport
    .addEventListener(
      "resize",
      () => {

        updateViewportHeight();


        if (
          document.activeElement
          === input
        ) {

          setTimeout(
            () =>
              scrollToBottom(
                true
              ),
            80
          );

        }

      }
    );

}



/*
  =========================
  SCROLL
  =========================
*/

function scrollToBottom(
  force = false
) {

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;


      if (force) {

        setTimeout(
          () => {

            chat.scrollTop =
              chat.scrollHeight;

          },
          100
        );

      }

    }
  );

}



/*
  =========================
  INPUT UI
  =========================
*/

function updateInputUI() {

  const hasText =
    input
      .value
      .trim()
      .length > 0;


  if (hasText) {

    composerActions
      .style
      .display =
      "none";


    micButton
      .style
      .display =
      "none";


    sendButton
      .classList
      .add(
        "visible"
      );

  }

  else {

    composerActions
      .style
      .display =
      "flex";


    micButton
      .style
      .display =
      "flex";


    sendButton
      .classList
      .remove(
        "visible"
      );

  }

}



/*
  =========================
  MESSAGE DOM
  =========================
*/

function createMessage(
  senderName,
  text,
  type
) {

  const group =
    document.createElement(
      "div"
    );


  group.className =
    `message-group ${type}`;


  const sender =
    document.createElement(
      "div"
    );


  sender.className =
    "sender";


  sender.textContent =
    senderName;


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message";


  message.textContent =
    text;


  group.appendChild(
    sender
  );


  group.appendChild(
    message
  );


  return group;

}



/*
  =========================
  RENDER HISTORY
  =========================
*/

function renderHistory() {

  messageList.innerHTML =
    "";


  if (
    conversationHistory.length === 0
  ) {

    const welcome =
      createMessage(
        "Moa 💞",
        "Hejj 💞",
        "ai"
      );


    messageList.appendChild(
      welcome
    );


    return;

  }


  for (
    const item
    of conversationHistory
  ) {

    if (
      item.role === "user"
    ) {

      messageList.appendChild(
        createMessage(
          "Jag",
          item.content,
          "user"
        )
      );

    }


    if (
      item.role === "assistant"
    ) {

      messageList.appendChild(
        createMessage(
          "Moa 💞",
          item.content,
          "ai"
        )
      );

    }

  }

}



/*
  =========================
  TYPING
  =========================
*/

function showTypingState() {

  profileStatus.textContent =
    "Skriver...";


  bitmojiImage.src =
    THINKING_BITMOJI;


  bitmojiCharacter
    .classList
    .remove(
      "peek"
    );


  bitmojiCharacter
    .classList
    .add(
      "thinking"
    );


  typingWrapper
    .classList
    .add(
      "visible"
    );


  scrollToBottom(
    true
  );

}



function hideTypingState() {

  profileStatus.textContent =
    "Online";


  bitmojiImage.src =
    PEEK_BITMOJI;


  bitmojiCharacter
    .classList
    .remove(
      "thinking"
    );


  bitmojiCharacter
    .classList
    .add(
      "peek"
    );


  typingWrapper
    .classList
    .remove(
      "visible"
    );

}



/*
  =========================
  CALL AI
  =========================
*/

async function getAIReply() {

  const response =
    await fetch(
      WORKER_URL,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            messages:
              conversationHistory,

            settings:
              aiSettings
          })
      }
    );


  let data;


  try {

    data =
      await response.json();

  }

  catch {

    throw new Error(
      "Invalid server response"
    );

  }


  if (
    !response.ok ||
    !data.ok
  ) {

    throw new Error(
      data.error ||
      "AI request failed"
    );

  }


  if (
    !data.reply
  ) {

    throw new Error(
      "No AI reply"
    );

  }


  return data.reply;

}



/*
  =========================
  SEND
  =========================
*/

let sending = false;


async function sendMessage() {

  if (sending) {
    return;
  }


  const text =
    input
      .value
      .trim();


  if (!text) {
    return;
  }


  sending = true;


  /*
    add user message
  */

  conversationHistory.push({
    role:
      "user",

    content:
      text
  });


  saveHistory();


  messageList.appendChild(
    createMessage(
      "Jag",
      text,
      "user"
    )
  );


  input.value =
    "";


  updateInputUI();


  scrollToBottom(
    true
  );


  showTypingState();


  try {

    const reply =
      await getAIReply();


    conversationHistory.push({
      role:
        "assistant",

      content:
        reply
    });


    saveHistory();


    hideTypingState();


    messageList.appendChild(
      createMessage(
        "Moa 💞",
        reply,
        "ai"
      )
    );


    scrollToBottom(
      true
    );

  }

  catch (error) {

    console.error(
      error
    );


    hideTypingState();


    let errorText =
      "Något gick fel 😭";


    if (
      error.message.includes(
        "balance"
      )
    ) {

      errorText =
        "API-saldot verkar vara slut 😭";

    }


    if (
      error.message.includes(
        "invalid"
      )
    ) {

      errorText =
        "API-nyckeln verkar inte fungera 😭";

    }


    messageList.appendChild(
      createMessage(
        "Moa 💞",
        errorText,
        "ai"
      )
    );


    scrollToBottom(
      true
    );

  }

  finally {

    sending =
      false;

  }

}



/*
  =========================
  EVENTS
  =========================
*/

input.addEventListener(
  "input",
  updateInputUI
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event
        .preventDefault();


      sendMessage();

    }

  }
);


sendButton
  .addEventListener(
    "click",
    sendMessage
  );


input.addEventListener(
  "focus",
  () => {

    setTimeout(
      () =>
        scrollToBottom(
          true
        ),
      250
    );

  }
);



/*
  =========================
  START
  =========================
*/

bitmojiImage.src =
  PEEK_BITMOJI;


bitmojiCharacter
  .classList
  .add(
    "peek"
  );


renderHistory();


updateInputUI();


scrollToBottom();

</script>
