<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>My AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000;
      --panel: #0f0f10;
      --line: #1e1e1f;
      --soft: #161617;
      --text: #fff;
      --muted: #8d8d92;
      --snap-red: #ff2d55;
      --snap-blue: #32a7ff;
      --composer-h: 76px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #050505;
    }

    .app {
      width: 100%;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
    }

    @media (min-width: 700px) {
      body {
        display: flex;
        justify-content: center;
        background: #050505;
      }

      .app {
        max-width: 430px;
        border-left: 1px solid #161616;
        border-right: 1px solid #161616;
      }
    }

    /* HEADER */
    .header {
      height: 78px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #0a0a0b;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
    }

    .profile {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-wrap {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe500, #ffcb00);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-fallback {
      font-size: 22px;
    }

    .profile-meta {
      min-width: 0;
    }

    .profile-name {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* CHAT AREA */
    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 12px 8px;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.02), rgba(255,255,255,0));
      scrollbar-width: none;
      position: relative;
    }

    .chat::-webkit-scrollbar {
      display: none;
    }

    .new-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0 18px;
    }

    .new-divider .line {
      height: 1px;
      background: #1d1d1e;
      flex: 1;
    }

    .new-divider .label {
      font-size: 12px;
      letter-spacing: 1px;
      color: #8a8a8a;
      font-weight: 700;
    }

    /* SNAP EVENT CARD */
    .snap-event {
      margin-bottom: 18px;
    }

    .snap-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--snap-blue);
      margin-bottom: 6px;
    }

    .snap-row {
      display: flex;
      gap: 10px;
    }

    .snap-bar {
      width: 4px;
      border-radius: 999px;
      background: var(--snap-blue);
    }

    .snap-card {
      flex: 1;
      min-height: 66px;
      border-radius: 10px;
      border: 1px solid #29292b;
      background: #111113;
      display: flex;
      align-items: center;
      padding: 14px 14px;
      gap: 12px;
    }

    .snap-square {
      width: 23px;
      height: 23px;
      border-radius: 6px;
      border: 3px solid var(--snap-blue);
      flex-shrink: 0;
    }

    .snap-card-title {
      font-size: 18px;
      font-weight: 700;
    }

    /* MESSAGES */
    .message-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-group.ai {
      align-items: flex-start;
    }

    .message-group.user {
      align-items: flex-end;
    }

    .sender {
      font-size: 13px;
      font-weight: 700;
      padding: 0 2px;
    }

    .message-group.ai .sender {
      color: var(--snap-blue);
    }

    .message-group.user .sender {
      color: var(--snap-red);
    }

    .bubble {
      max-width: 84%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.35;
      word-break: break-word;
    }

    .message-group.ai .bubble {
      background: #171719;
      border: 1px solid #252528;
      color: #fff;
      border-top-left-radius: 7px;
    }

    .message-group.user .bubble {
      background: #0f0f10;
      border: 1px solid #29292d;
      color: #fff;
      border-top-right-radius: 7px;
    }

    /* TYPING AVATAR ZONE */
    .bitmoji-zone {
      position: sticky;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      pointer-events: none;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      padding-left: 12px;
      margin-top: 8px;
    }

    .bitmoji-character {
      position: relative;
      width: 78px;
      height: 100px;
      transform: translateY(26px);
      transition: transform 0.25s ease, filter 0.25s ease;
      opacity: 0.98;
    }

    .bitmoji-character img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    }

    .bitmoji-character.typing {
      transform: translateY(10px) rotate(-2deg);
    }

    .thinking-emoji {
      position: absolute;
      right: -4px;
      top: 6px;
      font-size: 21px;
      opacity: 0;
      transform: scale(0.8);
      transition: 0.2s ease;
    }

    .bitmoji-character.typing .thinking-emoji {
      opacity: 1;
      transform: scale(1);
    }

    .typing-bubble-wrap {
      position: absolute;
      left: 66px;
      bottom: 56px;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transition: 0.22s ease;
    }

    .typing-bubble-wrap.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .typing-bubble {
      background: #ffffff;
      color: #111;
      border-radius: 18px;
      padding: 10px 13px;
      min-width: 54px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
      position: relative;
    }

    .typing-bubble::after {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 8px;
      width: 14px;
      height: 14px;
      background: white;
      border-bottom-right-radius: 14px;
      transform: rotate(35deg);
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: #111;
      border-radius: 50%;
      display: block;
      animation: bounce 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* COMPOSER */
    .composer-shell {
      position: relative;
      z-index: 5;
      flex-shrink: 0;
      background: rgba(10,10,11,0.98);
      border-top: 1px solid #18181b;
      padding: 8px 10px 10px;
      min-height: var(--composer-h);
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .camera-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .camera-btn svg {
      width: 24px;
      height: 24px;
    }

    .input-shell {
      flex: 1;
      min-width: 0;
      height: 44px;
      border-radius: 24px;
      border: 2px solid #36363a;
      background: #09090a;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 14px;
      padding-right: 10px;
    }

    .left-red-bar {
      width: 3px;
      height: 26px;
      border-radius: 99px;
      background: var(--snap-red);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
    }

    .chat-input::placeholder {
      color: #7d7d82;
    }

    .inside-actions,
    .outside-actions {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .mini-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .mini-btn svg {
      width: 22px;
      height: 22px;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #0a84ff;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .send-btn.show {
      display: flex;
    }

    .send-btn svg {
      width: 21px;
      height: 21px;
    }

    .spacer-bottom {
      height: 8px;
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <button class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div class="profile">
        <div class="avatar-wrap">
          <img src="bitmoji.png" alt="Bitmoji" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=&quot;avatar-fallback&quot;>🤖</div>';">
        </div>

        <div class="profile-meta">
          <div class="profile-name">My AI</div>
          <div class="profile-status">Online</div>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Call">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.6 10.8c1.7 3.3 4.3 5.9 7.6 7.6l2.5-2.5c.3-.3.8-.4 1.2-.3 1.3.4 2.7.6 4.1.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C11.5 22 2 12.5 2 1c0-.6.4-1 1-1h3.8c.6 0 1 .4 1 1 0 1.4.2 2.8.6 4.1.1.4 0 .9-.3 1.2l-2.5 2.5z"/>
          </svg>
        </button>

        <button class="icon-btn" aria-label="Video">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 10.5V7c0-1.1-.9-2-2-2H4C2.9 5 2 5.9 2 7v10c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2v-3.5l5 4v-11l-5 4z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="new-divider">
        <div class="line"></div>
        <div class="label">NU</div>
        <div class="line"></div>
      </div>

      <section class="snap-event">
        <div class="snap-label">My AI</div>
        <div class="snap-row">
          <div class="snap-bar"></div>
          <div class="snap-card">
            <div class="snap-square"></div>
            <div class="snap-card-title">Online</div>
          </div>
        </div>
      </section>

      <div class="message-group ai">
        <div class="sender">My AI</div>
        <div class="bubble">Hej 👋 Jag är din AI på Snapchat-style. Skriv något så svarar jag.</div>
      </div>

      <div id="messagesEnd"></div>

      <div class="bitmoji-zone">
        <div class="bitmoji-character" id="bitmojiCharacter">
          <img src="bitmoji.png" alt="Bitmoji">
          <div class="thinking-emoji">🤔</div>
        </div>

        <div class="typing-bubble-wrap" id="typingBubble">
          <div class="typing-bubble">
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>

      <div class="spacer-bottom"></div>
    </main>

    <div class="composer-shell">
      <div class="composer">
        <button class="camera-btn" aria-label="Camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
            <path d="M14.5 4l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l1.5-2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>

        <div class="input-shell">
          <div class="left-red-bar"></div>

          <input
            id="messageInput"
            class="chat-input"
            type="text"
            placeholder="Chat"
            autocomplete="off"
            autocorrect="on"
            enterkeyhint="send"
          />

          <div class="inside-actions" id="insideActions">
            <button class="mini-btn" aria-label="Voice">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
                <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"/>
                <path d="M19 10a7 7 0 0 1-14 0"/>
                <path d="M12 17v4"/>
              </svg>
            </button>

            <button class="mini-btn" aria-label="Sticker">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 3H8a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>
                <path d="M14 14l7 7"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="outside-actions" id="outsideActions">
          <button class="mini-btn" aria-label="Emoji">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <circle cx="9" cy="10" r="1" fill="currentColor"/>
              <circle cx="15" cy="10" r="1" fill="currentColor"/>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            </svg>
          </button>

          <button class="mini-btn" aria-label="Gallery">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <circle cx="8.5" cy="10" r="1.5"/>
              <path d="M21 15l-5-5-8 8"/>
            </svg>
          </button>
        </div>

        <button class="send-btn" id="sendButton" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");
    const insideActions = document.getElementById("insideActions");
    const outsideActions = document.getElementById("outsideActions");
    const typingBubble = document.getElementById("typingBubble");
    const bitmojiCharacter = document.getElementById("bitmojiCharacter");
    const messagesEnd = document.getElementById("messagesEnd");

    function scrollToBottom(force = false) {
      requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
        if (force) {
          setTimeout(() => {
            chat.scrollTop = chat.scrollHeight;
          }, 120);
        }
      });
    }

    function updateComposerState() {
      const hasText = input.value.trim().length > 0;

      if (hasText) {
        insideActions.style.display = "none";
        outsideActions.style.display = "none";
        sendButton.classList.add("show");
      } else {
        insideActions.style.display = "flex";
        outsideActions.style.display = "flex";
        sendButton.classList.remove("show");
      }
    }

    function createMessage(senderName, text, type) {
      const group = document.createElement("div");
      group.className = `message-group ${type}`;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = senderName;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      group.appendChild(sender);
      group.appendChild(bubble);
      return group;
    }

    function showTypingState() {
      typingBubble.classList.add("show");
      bitmojiCharacter.classList.add("typing");
      scrollToBottom(true);
    }

    function hideTypingState() {
      typingBubble.classList.remove("show");
      bitmojiCharacter.classList.remove("typing");
    }

    function generateAIReply(userText) {
      const text = userText.toLowerCase();

      if (text.includes("hej")) return "Hej du 👋 Vad vill du att vi ska snacka om?";
      if (text.includes("hur mår du")) return "Jag mår bra 🤍 Jag är redo att chatta med dig.";
      if (text.includes("vem är du")) return "Jag är My AI — fast gjord för att kännas mer som en riktig Snapchat-konversation.";
      if (text.includes("snap")) return "Nu börjar det faktiskt kännas mycket mer som Snapchat 😌";
      if (text.includes("bitmoji")) return "Bitmojin gör mycket av känslan faktiskt, speciellt när den dyker upp när jag skriver.";
      return "Det här ser riktigt bra ut nu. Nästa steg efter detta är att koppla chatten till riktig AI så svaren blir smarta på riktigt.";
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const userMessage = createMessage("Jag", text, "user");
      chat.insertBefore(userMessage, messagesEnd);

      input.value = "";
      updateComposerState();
      scrollToBottom(true);

      showTypingState();

      const reply = generateAIReply(text);

      setTimeout(() => {
        hideTypingState();

        const aiMessage = createMessage("My AI", reply, "ai");
        chat.insertBefore(aiMessage, messagesEnd);

        scrollToBottom(true);
      }, 1500);
    }

    input.addEventListener("input", updateComposerState);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("focus", () => {
      setTimeout(() => scrollToBottom(true), 250);
    });

    if (window.visualViewport) {
      const handleViewport = () => {
        if (document.activeElement === input) {
          scrollToBottom(true);
        }
      };

      window.visualViewport.addEventListener("resize", handleViewport);
      window.visualViewport.addEventListener("scroll", handleViewport);
    }

    updateComposerState();
    scrollToBottom(true);
  </script>
</body>
</html>
