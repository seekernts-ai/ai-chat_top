<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#000000" />
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000;
      --panel: #0b0b0d;
      --line: #1b1b1f;
      --bubble: #15151a;
      --bubble-border: #23232a;
      --text: #fff;
      --muted: #8b8b92;
      --snap-blue: #27a7ff;
      --snap-red: #ff2d55;
      --composer-height: 82px;
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-top: env(safe-area-inset-top);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      background: #050505;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    @media (min-width: 700px) {
      body {
        display: flex;
        justify-content: center;
        background: #050505;
      }

      .app {
        max-width: 430px;
        border-left: 1px solid #151515;
        border-right: 1px solid #151515;
      }
    }

    /* HEADER */

    .header {
      position: relative;
      z-index: 10;
      height: 78px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #09090b;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
    }

    .profile {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meta {
      min-width: 0;
    }

    .meta h1 {
      font-size: 18px;
      line-height: 1.1;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta p {
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* CHAT */

    .chat {
      position: absolute;
      inset: 78px 0 calc(var(--composer-height) + var(--safe-bottom)) 0;
      overflow-y: auto;
      padding: 14px 12px 120px;
      scrollbar-width: none;
      background: #000;
    }

    .chat::-webkit-scrollbar {
      display: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .divider .line {
      flex: 1;
      height: 1px;
      background: #19191d;
    }

    .divider .text {
      font-size: 12px;
      letter-spacing: 1px;
      color: #76767c;
      font-weight: 700;
    }

    .message-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .message-group.ai {
      align-items: flex-start;
    }

    .message-group.user {
      align-items: flex-end;
    }

    .sender {
      font-size: 13px;
      font-weight: 700;
      padding: 0 2px;
    }

    .message-group.ai .sender {
      color: var(--snap-blue);
    }

    .message-group.user .sender {
      color: var(--snap-red);
    }

    .bubble {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.35;
      word-break: break-word;
      border: 1px solid var(--bubble-border);
      background: var(--bubble);
      color: white;
    }

    .message-group.ai .bubble {
      border-top-left-radius: 7px;
    }

    .message-group.user .bubble {
      border-top-right-radius: 7px;
      max-width: 72%;
    }

    /* BITMOJI LAYER */

    .bitmoji-layer {
      position: absolute;
      left: 12px;
      bottom: calc(var(--safe-bottom) + 4px);
      width: 132px;
      height: 150px;
      z-index: 2;
      pointer-events: none;
    }

    .bitmoji-character {
      position: absolute;
      left: 0;
      bottom: -34px; /* detta gömmer nederdelen under panelen */
      width: 108px;
      transition: transform 0.22s ease;
    }

    .bitmoji-character img {
      width: 100%;
      height: auto;
      display: block;
    }

    .bitmoji-character.typing {
      transform: translateY(-8px);
    }

    .typing-pop {
      position: absolute;
      left: 72px;
      bottom: 92px;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: 0.18s ease;
    }

    .typing-pop.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .typing-bubble {
      min-width: 56px;
      min-height: 36px;
      padding: 10px 12px;
      border-radius: 20px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }

    .typing-bubble::after {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 7px;
      width: 14px;
      height: 14px;
      background: white;
      border-bottom-right-radius: 13px;
      transform: rotate(30deg);
    }

    .typing-dots {
      display: flex;
      gap: 5px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: #111;
      border-radius: 50%;
      animation: dotBounce 1s infinite ease-in-out;
      opacity: 0.45;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-3px);
        opacity: 1;
      }
    }

    /* COMPOSER */

    .composer-shell {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      min-height: var(--composer-height);
      padding: 8px 10px calc(10px + var(--safe-bottom));
      border-top: 1px solid #15151a;
      background: rgba(8,8,10,0.98);
      backdrop-filter: blur(10px);
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .camera-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .camera-btn svg {
      width: 24px;
      height: 24px;
    }

    .input-shell {
      flex: 1;
      min-width: 0;
      height: 46px;
      border-radius: 24px;
      border: 2px solid #36363b;
      background: #060607;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 12px;
    }

    .red-bar {
      width: 3px;
      height: 24px;
      border-radius: 999px;
      background: var(--snap-red);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
    }

    .chat-input::placeholder {
      color: #7e7e84;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .mini-btn {
      width: 31px;
      height: 31px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .mini-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #0a84ff;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .send-btn.show {
      display: flex;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <button class="icon-btn" aria-label="Tillbaka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>

      <div class="profile">
        <div class="avatar">
          <img src="bitmoji_idle.png" alt="Bitmoji">
        </div>

        <div class="meta">
          <h1>My AI</h1>
          <p>Online</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Ring">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.6 10.8c1.7 3.3 4.3 5.9 7.6 7.6l2.5-2.5c.3-.3.8-.4 1.2-.3 1.3.4 2.7.6 4.1.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C11.5 22 2 12.5 2 1c0-.6.4-1 1-1h3.8c.6 0 1 .4 1 1 0 1.4.2 2.8.6 4.1.1.4 0 .9-.3 1.2l-2.5 2.5z"/>
          </svg>
        </button>

        <button class="icon-btn" aria-label="Video">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 10.5V7c0-1.1-.9-2-2-2H4C2.9 5 2 5.9 2 7v10c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2v-3.5l5 4v-11l-5 4z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="divider">
        <div class="line"></div>
        <div class="text">NU</div>
        <div class="line"></div>
      </div>

      <div class="message-group ai">
        <div class="sender">My AI</div>
        <div class="bubble">Hej 👋 Jag är din AI på Snapchat-style. Skriv något så svarar jag.</div>
      </div>

      <div id="messagesEnd"></div>
    </main>

    <div class="bitmoji-layer">
      <div class="bitmoji-character" id="bitmojiCharacter">
        <img id="bitmojiImage" src="bitmoji_idle.png" alt="Bitmoji">
      </div>

      <div class="typing-pop" id="typingBubble">
        <div class="typing-bubble">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-shell">
      <div class="composer">

        <button class="camera-btn" aria-label="Kamera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
            <path d="M14.5 4l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l1.5-2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </button>

        <div class="input-shell">
          <div class="red-bar"></div>

          <input
            id="messageInput"
            class="chat-input"
            type="text"
            placeholder="Chat"
            autocomplete="off"
            autocorrect="on"
            enterkeyhint="send"
          />

          <div class="actions" id="extraActions">
            <!-- mic -->
            <button class="mini-btn" aria-label="Mikrofon">
              <svg viewBox="0 0 24 24">
                <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"></path>
                <path d="M19 10a7 7 0 0 1-14 0"></path>
                <path d="M12 17v4"></path>
              </svg>
            </button>

            <!-- smile -->
            <button class="mini-btn" aria-label="Emoji">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M9 10h.01"></path>
                <path d="M15 10h.01"></path>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              </svg>
            </button>

            <!-- sticker/chat -->
            <button class="mini-btn" aria-label="Sticker">
              <svg viewBox="0 0 24 24">
                <path d="M21 15a2 2 0 0 1-2 2H9l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>

            <!-- gallery -->
            <button class="mini-btn" aria-label="Galleri">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <circle cx="8.5" cy="10" r="1.4"></circle>
                <path d="M21 15l-5-5-8 8"></path>
              </svg>
            </button>
          </div>
        </div>

        <button class="send-btn" id="sendButton" aria-label="Skicka">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
            <path d="M13 6l6 6-6 6"></path>
          </svg>
        </button>

      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");
    const extraActions = document.getElementById("extraActions");
    const bitmojiImage = document.getElementById("bitmojiImage");
    const bitmojiCharacter = document.getElementById("bitmojiCharacter");
    const typingBubble = document.getElementById("typingBubble");
    const messagesEnd = document.getElementById("messagesEnd");

    const IDLE_BITMOJI = "bitmoji_idle.png";
    const THINKING_BITMOJI = "bitmoji_thinking.png";

    function scrollToBottom(force = false) {
      requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
        if (force) {
          setTimeout(() => {
            chat.scrollTop = chat.scrollHeight;
          }, 120);
        }
      });
    }

    function updateComposerState() {
      const hasText = input.value.trim().length > 0;

      if (hasText) {
        extraActions.style.display = "none";
        sendButton.classList.add("show");
      } else {
        extraActions.style.display = "flex";
        sendButton.classList.remove("show");
      }
    }

    function createMessage(senderName, text, type) {
      const group = document.createElement("div");
      group.className = `message-group ${type}`;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = senderName;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      group.appendChild(sender);
      group.appendChild(bubble);
      return group;
    }

    function showTypingState() {
      bitmojiImage.src = THINKING_BITMOJI;
      bitmojiCharacter.classList.add("typing");
      typingBubble.classList.add("show");
      scrollToBottom(true);
    }

    function hideTypingState() {
      bitmojiImage.src = IDLE_BITMOJI;
      bitmojiCharacter.classList.remove("typing");
      typingBubble.classList.remove("show");
    }

    function generateAIReply(userText) {
      const text = userText.toLowerCase();

      if (text.includes("hej")) {
        return "Hej 👋 Vad vill du att vi ska snacka om?";
      }

      if (text.includes("snap")) {
        return "Nu börjar det faktiskt kännas mycket mer som en riktig Snapchat-konversation.";
      }

      if (text.includes("bitmoji")) {
        return "Ja, Bitmojin gör jättemycket för känslan här faktiskt.";
      }

      if (text.includes("hur mår du")) {
        return "Jag mår bra 🤍 Jag är redo att chatta.";
      }

      return "Det här ser riktigt bra ut nu. Nästa steg efter detta är att koppla chatten till riktig AI så svaren blir smarta på riktigt.";
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const userMessage = createMessage("Jag", text, "user");
      chat.insertBefore(userMessage, messagesEnd);

      input.value = "";
      updateComposerState();
      scrollToBottom(true);

      showTypingState();

      const reply = generateAIReply(text);

      setTimeout(() => {
        hideTypingState();

        const aiMessage = createMessage("My AI", reply, "ai");
        chat.insertBefore(aiMessage, messagesEnd);

        scrollToBottom(true);
      }, 1500);
    }

    input.addEventListener("input", updateComposerState);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("focus", () => {
      setTimeout(() => scrollToBottom(true), 250);
    });

    if (window.visualViewport) {
      const handleViewport = () => {
        if (document.activeElement === input) {
          scrollToBottom(true);
        }
      };

      window.visualViewport.addEventListener("resize", handleViewport);
      window.visualViewport.addEventListener("scroll", handleViewport);
    }

    updateComposerState();
    scrollToBottom(true);
  </script>
</body>
</html>
