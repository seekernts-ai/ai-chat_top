<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #000;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 75px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #fffc00;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }

    .profile-text h3 {
      font-size: 16px;
    }

    .profile-text p {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    .actions {
      display: flex;
      gap: 12px;
      font-size: 22px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 78%;
      padding: 11px 14px;
      border-radius: 18px;
      line-height: 1.35;
      font-size: 15px;
    }

    .ai {
      align-self: flex-start;
      background: #262626;
      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;
      background: #1687ff;
      border-bottom-right-radius: 5px;
    }

    .typing {
      color: #888;
      font-size: 13px;
      display: none;
    }

    .input-area {
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #222;
      background: #000;
    }

    .plus {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #262626;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .input-wrap {
      flex: 1;
      background: #222;
      border-radius: 24px;
      padding: 0 15px;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      height: 42px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #777;
    }

    .send {
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fffc00;
      cursor: pointer;
      font-size: 18px;
    }

    .bottom-nav {
      height: 62px;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 22px;
    }

    .nav-item {
      opacity: 0.5;
      cursor: pointer;
    }

    .nav-item.active {
      opacity: 1;
      color: #fffc00;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">

    <div class="profile">
      <div class="avatar">🤖</div>

      <div class="profile-text">
        <h3>My AI</h3>
        <p>Online</p>
      </div>
    </div>

    <div class="actions">
      <span>📞</span>
      <span>⋮</span>
    </div>

  </div>


  <div class="chat" id="chat">

    <div class="message ai">
      Tjena 👋 Vad vill du snacka om?
    </div>

  </div>


  <div class="input-area">

    <button class="plus">+</button>

    <div class="input-wrap">
      <input
        id="messageInput"
        type="text"
        placeholder="Skicka ett meddelande..."
      >
    </div>

    <button class="send" onclick="sendMessage()">➤</button>

  </div>


  <div class="bottom-nav">
    <div class="nav-item">💬</div>
    <div class="nav-item">📍</div>
    <div class="nav-item active">◉</div>
    <div class="nav-item">▶</div>
    <div class="nav-item">👤</div>
  </div>

</div>


<script>

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  const userMessage = document.createElement("div");

  userMessage.className = "message user";
  userMessage.innerText = text;

  chat.appendChild(userMessage);

  input.value = "";

  chat.scrollTop = chat.scrollHeight;


  // Tillfälligt AI-svar
  setTimeout(() => {

    const aiMessage = document.createElement("div");

    aiMessage.className = "message ai";

    aiMessage.innerText =
      "Just nu är jag bara demo-AI 🤖 Vi kopplar in riktig AI snart.";

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

  }, 700);

}


input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
